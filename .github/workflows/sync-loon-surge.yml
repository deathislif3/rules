name: Daily Sync Loon Surge Only

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Loon and Surge only
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/blackmatrix7/ios_rule_script.git /tmp/upstream
          cd /tmp/upstream && git sparse-checkout set rule/Loon rule/Surge
          cd $GITHUB_WORKSPACE
          mkdir -p rule
          rsync -a --delete /tmp/upstream/rule/Loon/ rule/Loon/
          rsync -a --delete /tmp/upstream/rule/Surge/ rule/Surge/
          rm -rf rule/Clash rule/QuantumultX rule/Shadowrocket rule/AdGuard rewrite script icon external source blank

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync Loon & Surge rules $(date -u +%F)"
            git push
          fi
